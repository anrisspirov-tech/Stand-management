<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f59e0b">
<title>Stand Manager PRO</title>
<link id="manifestLink" rel="manifest" href='data:application/json;base64,eyJuYW1lIjoiU3RhbmQgTWFuYWdlciBQUk8iLCJzaG9ydF9uYW1lIjoiU3RhbmRQUk8iLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBmMGYwZiIsInRoZW1lX2NvbG9yIjoiI2Y1OWUwYiIsImljb25zIjpbXX0='>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0f0f0f;--card:#1e1e1e;--card2:#252525;--text:#fff;--muted:#999;--border:#333;--header:#1a1a1a;--btn-bg:#2f2f2f;--btn-border:#4a4a4a;--primary:#f59e0b;--primary-text:#000}
body.day{--bg:#f5f5f5;--card:#ffffff;--card2:#f0f0f0;--text:#111;--muted:#666;--border:#ddd;--header:#ffffff;--btn-bg:#e2e2e2;--btn-border:#b8b8b8}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;font-size:15px;transition:background 0.3s,color 0.3s}
.header{background:var(--header);padding:10px;text-align:center;border-bottom:3px solid var(--primary);position:sticky;top:0;z-index:100}
h1{color:var(--primary);margin:0;font-size:1.3em}
.small{font-size:0.75em;color:var(--muted)}
button{padding:10px 12px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-text);font-weight:bold;cursor:pointer;margin:3px 2px}
button:active{transform:scale(0.97)}
button.sec{background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border)}
button:disabled{opacity:0.5;cursor:not-allowed}
button.typebtn{flex:1;padding:8px;font-size:0.8em;background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border)}
button.typebtn.active{background:var(--primary);color:var(--primary-text)}
.quick-add-btn{flex:1;min-width:100px;padding:12px 8px;background:linear-gradient(135deg,#06b6d4,#a855f7);color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85em;margin:0}
.quick-add-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:8px 0}
.wrap{padding:8px;max-width:800px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0}
label{color:var(--primary);font-size:0.85em;font-weight:bold;display:block;margin:8px 0 3px}
input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:1em}
option{background:var(--card2);color:var(--text)}
.item{background:var(--card2);padding:10px;border-radius:8px;margin:6px 0;display:flex;flex-direction:column;gap:8px}
.item.fav{border-left:3px solid var(--primary)}
.item.grouped{border-left:3px solid #06b6d4}
.item-main{display:flex;gap:8px;align-items:flex-start;width:100%}
.item-info{flex:1;min-width:0}
.item-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;padding-top:8px;border-top:1px dashed var(--border)}
.item .item-name{font-size:var(--list-font-size,13px);font-weight:bold;line-height:1.3;word-break:break-word}
.item .item-cat{font-size:calc(var(--list-font-size,13px)*0.8);color:var(--muted);line-height:1.2}
.item .item-extra{font-size:calc(var(--list-font-size,13px)*0.8);color:#06b6d4;font-weight:bold;line-height:1.2;margin-top:2px}
.item .item-theme{font-size:calc(var(--list-font-size,13px)*0.85);color:#a855f7;font-style:italic;line-height:1.2;margin-top:2px}
.item .item-langs{font-size:calc(var(--list-font-size,13px)*0.8);color:#06b6d4;font-weight:bold;line-height:1.4;margin-top:4px;background:rgba(6,182,212,0.12);padding:4px 8px;border-radius:6px;border-left:3px solid #06b6d4}
.item .item-badge{font-size:calc(var(--list-font-size,13px)*0.75);padding:3px 8px;border-radius:99px;font-weight:bold;display:inline-block;margin-top:3px}
.item .type-label{font-size:calc(var(--list-font-size,13px)*0.7);padding:2px 6px;border-radius:99px;font-weight:bold}
.item .lang-label{font-size:calc(var(--list-font-size,13px)*0.7);padding:2px 7px;border-radius:99px;font-weight:bold;background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text)}
.item .qty-display{font-size:calc(var(--list-font-size,13px)*1.05);padding:8px 4px;font-weight:bold;width:60px;min-width:44px;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;font-family:inherit;-moz-appearance:textfield}
.item .qty-display::-webkit-outer-spin-button,.item .qty-display::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.item .qty-display:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.item .qty-btn{font-size:calc(var(--list-font-size,13px)*1);padding:8px 14px;border-radius:6px;border:0;font-weight:bold;cursor:pointer;background:var(--primary);color:var(--primary-text);margin:0}
.item .qty-btn.minus{background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border)}
.item .icon-btn{background:var(--btn-bg);color:var(--text);padding:8px 10px;border-radius:6px;border:1px solid var(--btn-border);font-weight:bold;cursor:pointer;font-size:calc(var(--list-font-size,13px)*0.95)}
.item .stand-btn{background:#0d3d47;color:#06b6d4;border:1px solid #06b6d4;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:calc(var(--list-font-size,13px)*0.85);margin:0}
.item .stand-btn.has{background:#06b6d4;color:#000}
.item .stand-btn.low{background:#ef4444;color:#fff;border-color:#ef4444;animation:pulse2 1.5s infinite}
.item .fav-btn{background:transparent;color:var(--primary);font-size:1.3em;padding:4px 8px;border:0;cursor:pointer}
.item .fav-btn.inactive{color:var(--muted);opacity:0.5}
.badge{padding:3px 8px;border-radius:99px;font-weight:bold}
.bad{background:#ef4444;color:#fff}
.good{background:#22c55e;color:#000}
.t-mag{background:#f59e0b;color:#000}.t-booklet{background:#22c55e;color:#000}.t-poster{background:#ec4899;color:#fff}
.row{display:flex;gap:6px}.row>div{flex:1}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{flex:1;min-width:60px;text-align:center;background:var(--card2);border-radius:8px;padding:8px 4px}
.count-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.count-box{background:var(--card2);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border)}
.count-box .num{font-size:1.5em;font-weight:bold;color:var(--primary)}
.count-box .label{font-size:0.8em;color:var(--muted);margin-top:4px}
.count-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.85em}
.count-table th{background:var(--card2);padding:8px;text-align:left;color:var(--primary)}
.count-table td{padding:8px;border-bottom:1px solid var(--border)}
.count-table tr.total-row td{font-weight:bold;background:var(--card2)}
.item-lang-stat{background:var(--card2);border-radius:10px;margin:6px 0;border:1px solid var(--border);overflow:hidden}
.item-lang-stat .stat-head{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none;transition:background 0.15s}
.item-lang-stat .stat-head:hover{background:rgba(168,85,247,0.1)}
.item-lang-stat .stat-head-left{flex:1;min-width:0}
.item-lang-stat .stat-name{font-weight:bold;font-size:0.95em;line-height:1.3;word-break:break-word;color:var(--text)}
.item-lang-stat .stat-summary{font-size:0.78em;color:var(--muted);margin-top:3px}
.item-lang-stat .stat-summary b{color:#a855f7}
.item-lang-stat .stat-arrow{color:var(--muted);font-size:1em;flex-shrink:0;transition:transform 0.2s}
.item-lang-stat.open .stat-arrow{transform:rotate(90deg)}
.item-lang-stat .stat-body{display:none;padding:0 12px 10px;border-top:1px dashed var(--border)}
.item-lang-stat.open .stat-body{display:block}
.item-lang-stat .stat-lang-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85em;gap:8px}
.item-lang-stat .stat-lang-row:last-child{border-bottom:0}
.item-lang-stat .stat-lang-name{color:var(--text);flex:1;min-width:0;word-break:break-word}
.item-lang-stat .stat-lang-qty{font-weight:bold;color:#a855f7;padding:2px 10px;border-radius:99px;background:rgba(168,85,247,0.15);white-space:nowrap}
.item-lang-stat .stat-lang-qty.zero{background:rgba(239,68,68,0.15);color:#ef4444}
.card[data-collapsible] > *:first-child{cursor:pointer;user-select:none;position:relative;padding-right:26px;min-height:20px}
.card[data-collapsible] > *:first-child::after{content:'▾';position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1em;font-weight:normal;transition:transform 0.2s;line-height:1}
.card[data-collapsible].collapsed > *:first-child::after{content:'▸'}
.card[data-collapsible].collapsed > *:not(:first-child){display:none!important}
.stand-tab{flex:1;padding:10px 6px;font-size:0.9em;font-weight:bold;background:var(--btn-bg);color:var(--text);border:2px solid var(--btn-border);border-radius:8px;cursor:pointer;margin:0;transition:all 0.15s;text-align:center;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand-tab.active{background:#06b6d4;color:#000;border-color:#06b6d4;box-shadow:0 0 10px rgba(6,182,212,0.5)}
.stand-tab .cnt{display:block;font-size:0.7em;opacity:0.85;font-weight:normal;margin-top:2px}
.stand-tabs{display:flex;gap:5px;margin-top:10px}
.stand-box{background:var(--card2);border-radius:10px;padding:12px;margin-top:10px;border-left:4px solid #06b6d4}
.stand-title{font-size:1.15em;font-weight:bold;color:#06b6d4;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stand-title .st-name{flex:1;min-width:0;word-break:break-word}
.stand-summary{color:var(--muted);font-size:0.85em;margin-bottom:10px}
.stand-summary b{color:var(--text)}
.stand-section-title{font-size:0.75em;color:var(--primary);font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 5px}
.stand-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--card);border-radius:6px;margin:3px 0;font-size:0.85em;gap:8px}
.stand-row .t-left{flex:1;min-width:0;word-break:break-word}
.stand-row .t-right{font-weight:bold;color:#06b6d4;white-space:nowrap}
.stand-item{padding:8px 10px;background:var(--card);border-radius:6px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.85em}
.stand-item.low-stock{border:1px solid #ef4444;background:rgba(239,68,68,0.1)}
.stand-item .ti-info{flex:1;min-width:0}
.stand-item .ti-name{font-weight:bold;word-break:break-word}
.stand-item .ti-meta{color:var(--muted);font-size:0.78em;margin-top:2px}
.stand-item .ti-qty{font-weight:bold;color:#06b6d4;font-size:1.05em;white-space:nowrap;text-align:right}
.stand-item.low-stock .ti-qty{color:#ef4444}
.stand-item .ti-qty .in-total{font-size:0.7em;color:var(--muted);font-weight:normal;display:block}
.stand-empty{text-align:center;padding:20px;color:var(--muted);font-size:0.9em}
.stand-field{background:var(--card);border-radius:8px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stand-field .sf-label{font-weight:bold;color:#06b6d4;font-size:1em;flex:1;min-width:0;word-break:break-word}
.stand-field select{width:110px;padding:8px;font-weight:bold;font-size:1.05em;text-align:center;flex-shrink:0}
.btn-mini{padding:4px 8px;font-size:0.75em;background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border);border-radius:6px;margin:0}
#standOverlay, #userOverlay, #regOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:99999;justify-content:center;align-items:center;padding:20px}
#standOverlay.show, #userOverlay.show, #regOverlay.show{display:flex}
#standBox, #userBox, #regBox{background:var(--card);border:2px solid #06b6d4;border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
#standBox h3, #userBox h3, #regBox h3{color:#06b6d4;text-align:center;margin:0 0 12px;font-size:1.1em;line-height:1.3}
.stand-info{background:var(--card2);border-radius:8px;padding:10px;text-align:center;font-size:0.85em;color:var(--muted);line-height:1.6;margin-bottom:12px}
.sync-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:0.8em;font-weight:bold;background:var(--btn-bg);color:var(--text);cursor:pointer;border:1px solid var(--btn-border)}
.sync-chip.synced{background:#22c55e;color:#000;border-color:#22c55e}
.sync-chip.offline{background:#ef4444;color:#fff;border-color:#ef4444}
.user-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#a855f7;color:#fff;font-size:0.85em;font-weight:bold;cursor:pointer}
.user-chip.no-user{background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border)}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.toolbar select{padding:6px 8px;font-size:0.85em;flex:1;min-width:120px}
.user-row{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:10px;border-radius:8px;margin:6px 0;gap:8px}
.user-row .uname{font-weight:bold}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.perm-grid label{display:flex;align-items:center;gap:6px;font-size:0.85em;color:var(--text);font-weight:normal;background:var(--card2);padding:8px;border-radius:8px;cursor:pointer}
.perm-grid input{width:auto;margin:0}
#toastBox{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:99998;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:92vw}
.toast{background:rgba(0,0,0,0.92);color:#fff;padding:10px 20px;border-radius:22px;font-size:0.9em;font-weight:bold;border:2px solid var(--primary);box-shadow:0 6px 20px rgba(0,0,0,0.55);animation:toastIn 0.25s ease;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastOut 0.25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-15px)}}
</style>
</head>
<body>

<div class="header">
<h1>STAND MANAGER</h1>
<div style="margin-top:6px;display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap">
<span class="sync-chip offline" id="syncChip"><span class="sync-dot"></span><span id="syncChipText">Офлайн</span></span>
<span class="user-chip no-user" id="userChip" onclick="openUserSelector()">👤 <span id="userChipText">Выбрать</span></span>
</div>
<div style="margin-top:6px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap">
<button onclick="toggleTheme()" id="bTheme" style="padding:6px 10px;font-size:0.85em;background:var(--btn-bg);color:var(--text);border:1px solid var(--btn-border)">🌙</button>
</div>
</div>

<div class="wrap">

<div class="stats">
<div class="stat"><div id="tot" style="font-weight:bold;font-size:1.2em">0</div><div class="small">Всего</div></div>
<div class="stat"><div id="tit" style="font-weight:bold">0</div><div class="small">Названий</div></div>
<div class="stat"><div id="cnt-mag" style="color:#f59e0b;font-weight:bold">0</div><div class="small">📰</div></div>
<div class="stat"><div id="cnt-booklet" style="color:#22c55e;font-weight:bold">0</div><div class="small">📖</div></div>
<div class="stat"><div id="cnt-poster" style="color:#ec4899;font-weight:bold">0</div><div class="small">🖼️</div></div>
</div>

<div class="stats" style="margin-top:6px">
<div class="stat" style="border:2px solid #22c55e"><div id="tot-stock" style="font-weight:bold;font-size:1.3em;color:#22c55e">0</div><div class="small">📦 В запасе</div></div>
<div class="stat" style="border:2px solid #06b6d4"><div id="tot-stands" style="font-weight:bold;font-size:1.3em;color:#06b6d4">0</div><div class="small">🏛️ На стендах</div></div>
</div>

<div class="card" data-collapsible="stands" style="border:2px solid #06b6d4">
<b style="color:#06b6d4">🏛️ Стенды</b>
<div class="stand-tabs">
<button type="button" id="st-1" class="stand-tab active" onclick="showStand(1)">🏛️ <span id="stn-1">Стенд 1</span><span class="cnt" id="stc-1">—</span></button>
<button type="button" id="st-2" class="stand-tab" onclick="showStand(2)">🏛️ <span id="stn-2">Стенд 2</span><span class="cnt" id="stc-2">—</span></button>
<button type="button" id="st-3" class="stand-tab" onclick="showStand(3)">🏛️ <span id="stn-3">Стенд 3</span><span class="cnt" id="stc-3">—</span></button>
<button type="button" id="st-4" class="stand-tab" onclick="showStand(4)">🏛️ <span id="stn-4">Стенд 4</span><span class="cnt" id="stc-4">—</span></button>
</div>
<div id="standContent" style="margin-top:10px"></div>
</div>

<div class="card" data-collapsible="items">
<div style="display:flex;justify-content:space-between;align-items:center">
<b>📦 Все издания</b>
</div>
<div class="toolbar">
<input id="search" placeholder="🔍 Поиск..." oninput="debouncedRender()" style="flex:2;padding:8px">
</div>
<div id="list" style="margin-top:8px"></div>
</div>

<div class="card" data-collapsible="add" id="addCard" style="border:2px solid #f59e0b">
<b style="color:#f59e0b">➕ Добавить новое издание</b>
<div id="addPermNotice" class="small" style="display:none;color:red;margin:8px 0;">⚠️ Нет прав.</div>
<label>📋 Тип</label>
<div style="display:flex;gap:4px;margin:8px 0">
<button type="button" onclick="setAddType('Журнал')" id="a-mag" class="typebtn active">📰 Журнал</button>
<button type="button" onclick="setAddType('Брошюра')" id="a-booklet" class="typebtn">📖 Брошюра</button>
<button type="button" onclick="setAddType('Постер')" id="a-poster" class="typebtn">🖼️ Постер</button>
</div>
<div class="row">
<div><label>📝 Название *</label><input id="title" placeholder="напр. Сторожевая башня"></div>
</div>
<div class="row">
<div><label>🏷️ Категория</label><input id="cat" placeholder="напр. Сторожевая"></div>
<div><label>📦 Всего штук</label><input id="qty" type="number" value="10"></div>
</div>
<div class="row">
<div><label>📅 Год</label><input id="year" placeholder="2026"></div>
<div><label>🔢 Номер</label><input id="issueNum" placeholder="1"></div>
</div>
<label>🌍 Язык</label>
<select id="lang">
<option value="ru">🇷🇺 Русский</option>
<option value="en">🇬🇧 Английский</option>
<option value="de">🇩🇪 Немецкий</option>
<option value="es">🇪🇸 Испанский</option>
<option value="fr">🇫🇷 Французский</option>
</select>
<button onclick="addItem()" id="btnAddItem" style="width:100%;margin-top:16px">➕ Добавить</button>
</div>
</div>

<div id="standOverlay" onclick="if(event.target===this)closeStandEditor()">
<div id="standBox" onclick="event.stopPropagation()">
<h3 id="standTitle">🏛️ Разложить по стендам</h3>
<div id="standEditorContent"></div>
</div>
</div>

<div id="userOverlay">
<div id="userBox">
<h3>👤 Кто вы?</h3>
<div id="userSelectList" style="margin-top:12px"></div>
<button class="sec" onclick="openRegHelper()" style="width:100%;margin-top:12px;background:#22c55e;color:#000">➕ Зарегистрироваться</button>
<button class="sec" onclick="closeUserSelector()" style="width:100%;margin-top:6px">✕ Закрыть</button>
</div>
</div>

<div id="regOverlay" onclick="if(event.target===this)closeRegHelper()">
<div id="regBox" onclick="event.stopPropagation()">
<h3 style="color:#06b6d4">👤 Регистрация помощника</h3>
<div class="small" style="text-align:center;color:var(--muted);margin-bottom:12px">Введите свои данные. Админ выдаст вам права.</div>
<label>Имя</label>
<input id="regHelperName" placeholder="Иван" style="margin-bottom:8px">
<label>Фамилия</label>
<input id="regHelperSurname" placeholder="Иванов" style="margin-bottom:8px">
<label>Email</label>
<input id="regHelperEmail" type="email" placeholder="you@example.com" style="margin-bottom:8px">
<div style="display:flex;gap:8px;margin-top:16px">
<button class="sec" onclick="closeRegHelper()" style="flex:1;padding:12px">Отмена</button>
<button onclick="saveRegHelper()" style="flex:1;padding:12px;background:#22c55e;color:#000">✓ Зарегистрироваться</button>
</div>
</div>
</div>

<div id="toastBox"></div>

<script>
var currentAddType = 'Журнал';
var curStand = 1;
var STAND_MAX = 10;
var MIN_STAND_ALERT = 3;

var standNames = { 1:'Стенд 1', 2:'Стенд 2', 3:'Стенд 3', 4:'Стенд 4' };
try{
  var _sn = JSON.parse(localStorage.getItem('stand_names')||'null');
  if(_sn && typeof _sn==='object'){
    for(var _k=1;_k<=4;_k++){ if(_sn[_k]) standNames[_k] = String(_sn[_k]); }
  }
}catch(e){}

var LANGS = {ru:'Русский',en:'Английский',de:'Немецкий',es:'Испанский',fr:'Французский'};
var LANG_FLAGS = {ru:'🇷🇺',en:'🇬🇧',de:'🇩🇪',es:'🇪🇸',fr:'🇫🇷'};

var PERM_KEYS = ['count','add','del','rename'];
var PERMS_PRESETS = {
  admin:{count:true,add:true,del:true,rename:true},
  manager:{count:true,add:true,del:true,rename:true},
  counter:{count:true,add:false,del:false,rename:true},
  viewer:{count:false,add:false,del:false,rename:false}
};

var items=[], users=[];
var currentUserEmail = localStorage.getItem('stand_user_email') || '';
var currentUser = null;

var cloudEnabled=localStorage.getItem('stand_cloud_enabled')!=='false';
var cloudId=localStorage.getItem('stand_cloud_id')||'';
var cloudApp=null, cloudDb=null, isSyncingFromCloud=false;

try{ items=JSON.parse(localStorage.getItem('stand_items_v4')||'[]'); }catch(e){ items=[]; }
try{ users=JSON.parse(localStorage.getItem('stand_users_v1')||'[]'); }catch(e){ users=[]; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stGet(it, n){ return (it.standCounts && (parseInt(it.standCounts[n])||0)) || 0; }
function stSum(it){ return stGet(it,1)+stGet(it,2)+stGet(it,3)+stGet(it,4); }
function totalIt(it){ return (parseInt(it.qty)||0) + stSum(it); }
function getDisplayName(it){ return (it.names && it.names.ru) || '—'; }
function getTypeIcon(tp){ if(tp==='Журнал') return '📰'; if(tp==='Брошюра') return '📖'; if(tp==='Постер') return '🖼️'; return '📄'; }
function getLangDisplay(code){ return (LANG_FLAGS[code]||'🌐')+' '+(LANGS[code]||code); }
function hasPerm(perm){ if(!currentUser) return false; if(currentUser.role==='admin') return true; return !!(currentUser.perms && currentUser.perms[perm]); }

function toast(msg) {
    var box = document.getElementById('toastBox');
    var el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    box.appendChild(el);
    setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, 2200);
}

function toggleTheme() {
  document.body.classList.toggle('day');
  localStorage.setItem('stand_theme', document.body.classList.contains('day')?'day':'dark');
}

function updateUI() {
    if(!currentUser) return;
    document.getElementById('userChipText').textContent = currentUser.name;
    document.getElementById('userChip').className = 'user-chip';
    
    var canAdd = hasPerm('add');
    document.getElementById('addCard').style.display = canAdd ? 'block' : 'none';
    document.getElementById('btnAddItem').disabled = !canAdd;
    
    render();
}

function saveRegHelper() {
    var name = document.getElementById('regHelperName').value.trim();
    var surname = document.getElementById('regHelperSurname').value.trim();
    var email = document.getElementById('regHelperEmail').value.trim().toLowerCase();
    if(!name || !surname || !email) { toast('⚠️ Заполните все поля'); return; }
    
    currentUserEmail = email;
    localStorage.setItem('stand_user_email', email);
    
    currentUser = users.find(u => u.email === email);
    if(!currentUser) {
        currentUser = { id: Date.now()+Math.random(), name: name, surname: surname, email: email, role: 'counter', perms: PERMS_PRESETS.counter };
        users.push(currentUser);
        saveToLocal();
        if(cloudEnabled && cloudDb) pushToCloud();
    } else {
        currentUser.name = name;
        currentUser.surname = surname;
        saveToLocal();
        if(cloudEnabled && cloudDb) pushToCloud();
    }
    
    document.getElementById('regOverlay').classList.remove('show');
    document.getElementById('userOverlay').classList.remove('show');
    updateUI();
}

function openUserSelector() { 
    renderUserSelectList(); 
    document.getElementById('userOverlay').classList.add('show'); 
}
function closeUserSelector() { document.getElementById('userOverlay').classList.remove('show'); }
function openRegHelper() { 
    closeUserSelector();
    document.getElementById('regOverlay').classList.add('show'); 
}
function closeRegHelper() { document.getElementById('regOverlay').classList.remove('show'); }

function renderUserSelectList() {
    var list = document.getElementById('userSelectList');
    if(!list) return;
    if(users.length===0){ list.innerHTML = '<div class="small" style="text-align:center;padding:20px">— нет пользователей —</div>'; return; }
    var h = '';
    users.forEach(u => {
        var isCur = u.email == currentUserEmail;
        h += '<div onclick="pickUser(\''+u.email+'\')" style="background:var(--card2);padding:14px;border-radius:10px;margin:6px 0;cursor:pointer;border:2px solid '+(isCur?'#22c55e':'transparent')+'"><b style="font-size:1.1em">👤 '+esc(u.name)+'</b> <span class="urole role-'+u.role+'">'+esc(u.role)+'</span></div>';
    });
    list.innerHTML = h;
}

function pickUser(email) {
    currentUserEmail = email;
    localStorage.setItem('stand_user_email', email);
    currentUser = users.find(u => u.email === email);
    updateUI();
    closeUserSelector();
    toast('✅ Вход выполнен');
}

function saveToLocal() {
    localStorage.setItem('stand_items_v4', JSON.stringify(items));
    localStorage.setItem('stand_users_v1', JSON.stringify(users));
    localStorage.setItem('stand_names', JSON.stringify(standNames));
}

async function initFirebase(){
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js');
    const {getFirestore,doc,setDoc,onSnapshot} = await import('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js');
    if(!cloudApp){ 
      cloudApp=initializeApp({"apiKey":"AIzaSyCKoGOE84zPuc4t6UQrDYMbooCR43p0FyQ","authDomain":"stand-management-a46a7.firebaseapp.com","projectId":"stand-management-a46a7","storageBucket":"stand-management-a46a7.firebasestorage.app","messagingSenderId":"304875768432","appId":"1:304875768432:web:470adb4707b8a3680482b5"}); 
      cloudDb=getFirestore(cloudApp); 
      window._fb={doc,setDoc,onSnapshot}; 
    }
    var dRef=window._fb.doc(cloudDb,'stands',cloudId);
    window._fb.onSnapshot(dRef, function(snap){
      if(!snap.exists()) return;
      var data=snap.data(); if(!data || isSyncingFromCloud) return;
      isSyncingFromCloud=true;
      if(data.items) items=data.items;
      if(data.users) users=data.users;
      if(data.standNames) standNames=data.standNames;
      saveToLocal(); 
      if(currentUserEmail) currentUser = users.find(u=>u.email===currentUserEmail);
      updateUI();
      document.getElementById('syncChipText').textContent = 'Синхронизировано';
      document.getElementById('syncChip').className = 'sync-chip synced';
      isSyncingFromCloud=false;
    });
  }catch(e){ console.error(e); }
}

async function pushToCloud(){
  if(!cloudEnabled || !cloudDb) return;
  try{
    var dRef=window._fb.doc(cloudDb,'stands',cloudId);
    await window._fb.setDoc(dRef,{items:items,users:users,standNames:standNames},{merge:true});
  }catch(e){}
}

function showStand(n){
  curStand = n;
  document.querySelectorAll('.stand-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('st-'+n).classList.add('active');
  renderStand();
}

function renderStand(){
  var cont = document.getElementById('standContent');
  var list = items.filter(it => stGet(it, curStand) > 0);
  if(list.length === 0) {
    cont.innerHTML = '<div class="stand-empty">Стенд пуст</div>';
    return;
  }
  var h = '<div class="stand-box"><div class="stand-title"><span class="st-name">🏛️ '+esc(standNames[curStand])+'</span></div>';
  list.forEach(it => {
    var isLow = stGet(it, curStand) < MIN_STAND_ALERT && parseInt(it.qty) > 0;
    h += '<div class="stand-item '+(isLow?'low-stock':'')+'"><div class="ti-info"><div class="ti-name">'+getTypeIcon(it.type)+' '+esc(getDisplayName(it))+'</div></div>';
    h += '<div class="ti-qty">'+stGet(it,curStand)+' / '+totalIt(it)+' шт.</div></div>';
  });
  h += '</div>';
  cont.innerHTML = h;
}

function render(){
  if(!currentUser) return;
  var listEl = document.getElementById('list');
  if(!listEl) return;
  var h = '';
  var canCount = hasPerm('count');
  var canDel = hasPerm('del');
  
  items.forEach(it => {
    var tot = totalIt(it);
    var stock = it.qty || 0;
    h += '<div class="item">';
    h += '<div class="item-main"><div class="item-info">';
    h += '<b class="item-name">'+getTypeIcon(it.type)+' '+esc(getDisplayName(it))+'</b>';
    h += '<div class="item-cat">📦 в запасе: '+stock+'</div>';
    h += '<span class="item-badge good">Всего '+tot+'</span>';
    h += '</div></div>';
    
    h += '<div class="item-actions">';
    if(canCount) h += '<button class="qty-btn minus" onclick="changeQty('+it.id+',-1)">−</button>';
    h += '<input type="number" class="qty-display" value="'+tot+'" readonly>';
    if(canCount) h += '<button class="qty-btn" onclick="changeQty('+it.id+',1)">+</button>';
    if(canCount) h += '<button class="stand-btn" onclick="openStandEditor('+it.id+')">🏛️ На стенды</button>';
    if(canDel) h += '<button class="icon-btn" onclick="deleteItem('+it.id+')">🗑️</button>';
    h += '</div></div>';
  });
  listEl.innerHTML = h;
  
  for(var n=1;n<=4;n++){
    var cnt = 0;
    items.forEach(it => cnt += stGet(it,n));
    document.getElementById('stc-'+n).textContent = cnt > 0 ? cnt+' шт.' : '—';
    document.getElementById('stn-'+n).textContent = standNames[n];
  }
  document.getElementById('tot').textContent = items.reduce((sum, it) => sum + totalIt(it), 0);
  renderStand();
}

function changeQty(id, d) {
  if(!hasPerm('count')) return;
  var it = items.find(x=>x.id==id);
  if(it) { it.qty = Math.max(0, (parseInt(it.qty)||0) + d); saveToLocal(); render(); pushToCloud(); }
}

function deleteItem(id) {
  if(!hasPerm('del')) return;
  if(confirm('Удалить?')) {
    items = items.filter(x=>x.id!=id);
    saveToLocal(); render(); pushToCloud();
  }
}

var _standItemId = null;
function openStandEditor(id) {
  _standItemId = id;
  var it = items.find(x=>x.id==id);
  if(!it) return;
  var h = '<div class="stand-info">Всего: <b>'+totalIt(it)+'</b> · В запасе: <b>'+(it.qty||0)+'</b></div>';
  for(var n=1;n<=4;n++) {
    h += '<div class="stand-field"><span class="sf-label">🏛️ '+esc(standNames[n])+'</span>';
    h += '<select id="sted-'+n+'">';
    for(var i=0;i<=10;i++) h += '<option value="'+i+'" '+(stGet(it,n)===i?'selected':'')+'>'+i+'</option>';
    h += '</select></div>';
  }
  h += '<div style="display:flex;gap:8px;margin-top:14px">';
  h += '<button class="sec" onclick="closeStandEditor()">Отмена</button>';
  h += '<button onclick="saveStandEditor()" style="background:#22c55e;color:#000">💾 Сохранить</button>';
  h += '</div>';
  document.getElementById('standEditorContent').innerHTML = h;
  document.getElementById('standOverlay').classList.add('show');
}
function closeStandEditor() { document.getElementById('standOverlay').classList.remove('show'); }

function saveStandEditor() {
  if(!_standItemId) return;
  var it = items.find(x=>x.id==_standItemId);
  if(!it) return;
  
  var oldSum = stSum(it);
  var newSum = 0;
  for(var n=1;n<=4;n++) {
    var val = parseInt(document.getElementById('sted-'+n).value)||0;
    if(!it.standCounts) it.standCounts = {};
    it.standCounts[n] = val;
    newSum += val;
  }
  
  var diff = newSum - oldSum;
  if(diff > 0) it.qty = Math.max(0, (parseInt(it.qty)||0) - diff);
  else if(diff < 0) it.qty = (parseInt(it.qty)||0) + Math.abs(diff);
  
  saveToLocal(); render(); pushToCloud(); closeStandEditor();
  toast('Сохранено');
}

function addItem() {
  if(!hasPerm('add')) return;
  var title = document.getElementById('title').value.trim();
  if(!title) { toast('Введите название'); return; }
  var newItem = {
    id: Date.now()+Math.random(),
    names: {ru: title},
    type: currentAddType,
    cat: document.getElementById('cat').value,
    qty: parseInt(document.getElementById('qty').value)||0,
    year: document.getElementById('year').value,
    issueNum: document.getElementById('issueNum').value,
    lang: document.getElementById('lang').value,
    standCounts: {1:0,2:0,3:0,4:0}
  };
  items.push(newItem);
  saveToLocal(); render(); pushToCloud();
  document.getElementById('title').value = '';
  toast('✅ Добавлено');
}

function setAddType(t) {
  currentAddType = t;
  document.querySelectorAll('.typebtn').forEach(b=>b.classList.remove('active'));
  var map = {'Журнал':'a-mag','Брошюра':'a-booklet','Постер':'a-poster'};
  if(map[t]) document.getElementById(map[t]).classList.add('active');
}

function debouncedRender(){ render(); }

function init() {
  if(!currentUserEmail) {
    document.getElementById('userOverlay').classList.add('show');
  } else {
    currentUser = users.find(u=>u.email===currentUserEmail);
    updateUI();
  }
  if(cloudEnabled && cloudId) initFirebase();
}
init();
</script>
</body>
</html>
